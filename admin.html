<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Tournament Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html">HOME</a>
    <a href="submit.html">SUBMIT RESULT</a>
    <a href="ranking.html">RANKING</a>
    <a href="results.html">RESULTS</a>
    <a href="admin.html" class="active">ADMIN</a>
  </nav>

  <main class="container">
    <h1>FC Mobile Tournament Tracker</h1>

    <!-- Forma za prijavu -->
    <div id="auth-section" class="card">
      <h2>Admin Login</h2>
      <form id="login-form">
        <input type="password" id="admin-password" placeholder="Unesite lozinku..." required style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">
        <button type="submit" class="btn" style="width: 100%;">PRIJAVI SE</button>
      </form>
    </div>

    <!-- Admin Sadržaj -->
    <div id="admin-content" style="display: none;">
      
      <!-- STEP 1: Player Pool -->
      <div class="card">
        <h3>STEP 1</h3>
        <h2>Player Pool</h2>
        <p>Add every player who might take part.</p>

        <form id="add-player-form">
          <label>Player name</label>
          <input type="text" id="player-name" placeholder="Ime igrača" required style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">

          <label>Discord ID (optional)</label>
          <input type="text" id="discord-id" placeholder="npr. 123456789012345678" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;">

          <button type="submit" class="btn">ADD PLAYER</button>
        </form>

        <p style="margin-top: 15px;">Pool size: <strong id="pool-size">0</strong></p>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
      </div>

      <!-- STEP 2: Start Tournament -->
      <div class="card" style="margin-top: 20px;">
        <h3>STEP 2</h3>
        <button id="start-tournament-btn" class="btn" style="width: 100%;">START TOURNAMENT</button>
      </div>

    </div>
  </main>

  <!-- Verzionisanje JS fajlova tera pretraživač da osveži kôd -->
  <script src="js/config.js?v=2"></script>
  <script src="js/admin.js?v=2"></script>
</body>
</html>
